services:
  - type: web
    name: chemeng-ai-mcp-server
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python3 test_chemeng_ai.py
    startCommand: uvicorn chemeng_ai_mcp_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
    healthCheckPath: /system-instructions
